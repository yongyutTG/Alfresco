name: CI-CD Alfresco Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test PHP and JavaScript
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, dom, fileinfo, xml, xmlreader, xmlwriter, sqlite3
          tools: composer:v2
          coverage: none
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: Install dependencies including PHPUnit
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare test directories
        run: mkdir -p writable/cache writable/logs writable/session
      - name: Check PHP syntax
        run: find app tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: find public/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run PHP tests
        run: composer test -- --no-coverage --no-logging --do-not-cache-result
      - name: Run JavaScript regression tests
        run: node --test tests/*.test.cjs tests/javascript/*.test.cjs

  deploy:
    name: Deploy after tests pass
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, alfresco-production]
    concurrency:
      group: alfresco-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy
        shell: bash
        run: bash "$GITHUB_WORKSPACE/build/deploy.sh"
